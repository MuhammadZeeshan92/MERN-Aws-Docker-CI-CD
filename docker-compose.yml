services:

  backend:
    build:
      context: ./Backend

    container_name: quickpick-backend

    ports:
      - "5000:5000"

    env_file:
      - ./Backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend

    container_name: quickpick-frontend

    ports:
      - "3000:80"

    restart: unless-stopped